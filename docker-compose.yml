services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragplatform
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docai-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # FIX #34 — DB_HOST must be the Docker Compose service name ("postgres"),
      # not "localhost".  Inside the Docker network each service is reachable by
      # its service name; "localhost" inside the app container resolves to the
      # app container itself, not to the postgres container, so the JDBC
      # connection attempt fails with "Connection refused" at startup.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ragplatform
      DB_USER: raguser
      DB_PASSWORD: ragpassword
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    profiles:
      - full

volumes:
  pgdata:
  uploads: