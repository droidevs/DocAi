<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign In — DocAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body class="auth-page d-flex align-items-center justify-content-center min-vh-100">

<div class="auth-card card shadow-lg border-0" style="width: 420px; max-width: 95vw;">
    <div class="card-body p-5">
        <!-- Logo -->
        <div class="text-center mb-4">
            <div class="auth-logo-icon mb-3">
                <i class="bi bi-robot text-primary" style="font-size: 2.5rem;"></i>
            </div>
            <h1 class="h3 fw-bold">Welcome back</h1>
            <p class="text-muted small">Sign in to your DocAI account</p>
        </div>

        <!-- Alerts -->
        <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
            <i class="bi bi-exclamation-circle me-1"></i>
            Invalid username or password. Please try again.
        </div>
        <div th:if="${param.logout}" class="alert alert-info py-2 small" role="alert">
            <i class="bi bi-check-circle me-1"></i>
            You have been signed out successfully.
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-medium small">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="Enter your username" required autofocus/>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-medium small">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Enter your password" required/>
                    <button class="btn btn-outline-secondary" type="button" id="togglePwd">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
        </form>

        <hr class="my-4"/>
        <p class="text-center text-muted small mb-0">
            Don't have an account?
            <a th:href="@{/register}" class="fw-semibold text-decoration-none">Create one</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('togglePwd')?.addEventListener('click', () => {
        const pwd = document.getElementById('password');
        const icon = document.querySelector('#togglePwd i');
        pwd.type = pwd.type === 'password' ? 'text' : 'password';
        icon.className = pwd.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    });
</script>
</body>
</html>
