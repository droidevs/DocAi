<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="${pageTitle != null ? pageTitle + ' — DocAI' : 'DocAI'}">DocAI</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <!-- Custom CSS -->
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
    <th:block th:replace="${head}"></th:block>
</head>
<body class="bg-light">

<!-- Sidebar + Main layout -->
<div class="d-flex" id="app-wrapper" th:fragment="layout(content, head)">

    <!-- SIDEBAR -->
    <nav id="sidebar" class="sidebar d-flex flex-column flex-shrink-0 p-3">
        <!-- Brand -->
        <a href="/dashboard" class="sidebar-brand d-flex align-items-center mb-4 text-decoration-none">
            <i class="bi bi-robot fs-4 me-2 text-primary"></i>
            <span class="fw-bold fs-5">DocAI</span>
        </a>

        <!-- Nav links -->
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a th:href="@{/dashboard}" class="nav-link" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/documents}" class="nav-link" th:classappend="${activePage == 'documents' ? 'active' : ''}">
                    <i class="bi bi-file-earmark-pdf me-2"></i>Documents
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/upload}" class="nav-link" th:classappend="${activePage == 'upload' ? 'active' : ''}">
                    <i class="bi bi-cloud-upload me-2"></i>Upload
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/chat}" class="nav-link" th:classappend="${activePage == 'chat' ? 'active' : ''}">
                    <i class="bi bi-chat-dots me-2"></i>Chat
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/search}" class="nav-link" th:classappend="${activePage == 'search' ? 'active' : ''}">
                    <i class="bi bi-search me-2"></i>Search
                </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin}" class="nav-link" th:classappend="${activePage == 'admin' ? 'active' : ''}">
                    <i class="bi bi-shield-check me-2"></i>Admin
                </a>
            </li>
        </ul>

        <!-- User footer -->
        <hr/>
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
                <div class="user-avatar me-2">
                    <i class="bi bi-person-circle fs-4"></i>
                </div>
                <span class="fw-semibold text-truncate" sec:authentication="name">User</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person me-1"></i> Profile</a></li>
                <li><hr class="dropdown-divider"/></li>
                <li>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="dropdown-item text-danger">
                            <i class="bi bi-box-arrow-right me-1"></i> Sign out
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main-content flex-grow-1">
        <!-- Top bar -->
        <header class="top-bar d-flex align-items-center px-4 py-3 bg-white border-bottom shadow-sm">
            <button class="btn btn-link d-lg-none me-2 p-0" id="sidebarToggle">
                <i class="bi bi-list fs-4"></i>
            </button>
            <h1 class="h5 mb-0 fw-semibold" th:text="${pageTitle ?: 'Dashboard'}">Dashboard</h1>
            <div class="ms-auto d-flex align-items-center gap-2">
                <span class="badge bg-success-subtle text-success" id="status-badge">
                    <i class="bi bi-circle-fill me-1" style="font-size: 0.5rem;"></i>Online
                </span>
            </div>
        </header>

        <!-- Page content -->
        <div class="page-content p-4">
            <!-- Toast container -->
            <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999;" id="toastContainer"></div>

            <!-- Main slot -->
            <th:block th:replace="${content}"></th:block>
        </div>
    </main>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- App JS -->
<script th:src="@{/js/app.js}"></script>
<th:block th:replace="${scripts}"></th:block>
</body>
</html>
