# =============================================
# RAG PLATFORM - APPLICATION CONFIGURATION
# =============================================

spring:
  application:
    name: rag-platform

  # Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ragplatform}
    username: ${DB_USER:raguser}
    password: ${DB_PASSWORD:ragpassword}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # File Upload
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

  # Thymeleaf
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  # AI - OpenAI
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-api-key-here}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1
          max-tokens: 2000
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

  # Cache
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

  # Async
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100
      thread-name-prefix: rag-async-

# Security / JWT
app:
  jwt:
    secret: ${JWT_SECRET:your-very-long-secret-key-that-should-be-at-least-256-bits-long-for-hs256}
    expiration-ms: 86400000       # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

  # File Storage
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-file-size-mb: 50
    allowed-content-types:
      - application/pdf

  # RAG Configuration
  rag:
    chunk-size: 800
    chunk-overlap: 150
    top-k: 5
    similarity-threshold: 0.70
    max-context-tokens: 6000
    embedding-batch-size: 20

  # CORS
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8080}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

# Logging
logging:
  level:
    com.ragplatform: DEBUG
    org.springframework.security: WARN
    org.springframework.ai: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: ${PORT:8080}
  compression:
    enabled: true
  error:
    include-message: never
    include-stacktrace: never
